name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The setup-check probe the Account settings screen runs. Under the
      # offline seam it answers "mocked" for every provider, so CI exercises
      # the script, its target resolution and the probe's verdict plumbing end
      # to end with no keys and no network. The HTTP request shapes themselves
      # are covered by the providers tests.
      - name: Setup-check probe under mocks
        env:
          OVERHEARD_MOCK_PROVIDERS: "1"
        run: npm run check:search

      - name: Build
        run: npm run build

      # The production entry is the one thing unit tests cannot cover: it wraps
      # the built fetch handler, opens the database, runs migrations and starts
      # the worker. Booting it with the offline provider seam costs nothing and
      # catches a broken build that still typechecks. /start waits out the
      # boot; / and /settings are requested after it, so a crash in their
      # server rendering fails CI instead of shipping. The last checks hit the
      # gate in front of the static files, which only exists in this entry.
      - name: Boot and smoke the screens
        shell: bash
        env:
          OVERHEARD_MOCK_PROVIDERS: "1"
          DATABASE_PATH: ./data/ci.db
          PORT: "3900"
        run: |
          npm start > server.log 2>&1 &
          server_pid=$!
          curl --fail --silent --show-error \
               --retry 30 --retry-delay 2 --retry-connrefused \
               --output /dev/null http://127.0.0.1:3900/start
          echo "/start answered 200"
          for path in / /settings; do
            curl --fail --silent --show-error \
                 --output /dev/null "http://127.0.0.1:3900$path"
            echo "$path answered 200"
          done
          curl --silent --show-error --dump-header headers.txt --output /dev/null \
               http://127.0.0.1:3900/settings
          grep -i "^x-frame-options: DENY" headers.txt
          grep -i "^content-security-policy: frame-ancestors 'none'" headers.txt
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
                        --header "Host: evil.example" http://127.0.0.1:3900/settings)
          test "$status" = "403"
          echo "foreign Host refused"
          asset=$(ls dist/client/assets/*.js | head -n 1 | sed 's|dist/client||')
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
                        --header "Host: evil.example" "http://127.0.0.1:3900$asset")
          test "$status" = "403"
          echo "foreign Host refused on a static file"
          grep "\[boot\] Overheard AI ready" server.log
          # A second copy on the same port says so and stops before it boots.
          status=0
          node server/index.mjs > second.log 2>&1 || status=$?
          test "$status" = "1"
          grep "already running" second.log
          if grep -q "\[boot\]" second.log; then echo "the second copy booted"; exit 1; fi
          echo "second copy stopped before booting"
          # Started the way the icon starts it, it hands over to the running copy.
          BROWSER=none node server/index.mjs --open > third.log 2>&1
          grep "already running" third.log
          echo "second --open handed over"
          kill "$server_pid" || true

      - name: Server log
        if: always()
        shell: bash
        run: cat server.log || true

      # `npm run shortcut` makes the icon and starts the app the way the icon
      # does, reading .env from the app's folder. Then each system opens the
      # icon itself: Windows through the shortcut, macOS through the app.
      - name: Make the icon and start the app with it
        shell: bash
        env:
          BROWSER: none
        run: |
          printf 'PORT=3902\nDATABASE_PATH=./data/ci-icon.db\nOVERHEARD_MOCK_PROVIDERS=1\n' > .env
          npm run shortcut
          curl --fail --silent --show-error \
               --retry 30 --retry-delay 2 --retry-connrefused \
               --output /dev/null http://127.0.0.1:3902/start
          grep "\[boot\] Overheard AI ready" data/overheard.log
          if [ "$RUNNER_OS" = "Linux" ]; then
            grep '^Exec=env "PATH=' "$HOME/.local/share/applications/overheard-ai.desktop"
          fi

      - name: Stop the app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Get-NetTCPConnection -LocalPort 3902 -State Listen | ForEach-Object { Stop-Process -Id \$_.OwningProcess -Force }"
          else
            kill $(lsof -ti tcp:3902 -sTCP:LISTEN)
          fi
          sleep 2
          if curl --silent --output /dev/null http://127.0.0.1:3902/start; then echo "still running"; exit 1; fi

      - name: Open the Windows shortcut
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BROWSER: none
        run: |
          $link = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Overheard AI.lnk'
          Start-Process $link
          curl.exe --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused --output NUL http://127.0.0.1:3902/start
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-NetTCPConnection -LocalPort 3902 -State Listen | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force }

      # Opened from LaunchServices, the app gets no environment from this step,
      # so it opens Safari on the runner. That is harmless here.
      - name: Open the Mac app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          open "$HOME/Applications/Overheard AI.app"
          curl --fail --silent --show-error \
               --retry 30 --retry-delay 2 --retry-connrefused \
               --output /dev/null http://127.0.0.1:3902/start
          kill $(lsof -ti tcp:3902 -sTCP:LISTEN)

      - name: Icon log
        if: always()
        shell: bash
        run: cat data/overheard.log || true

  bun:
    name: Bun on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: npm ci

      - name: Test under Bun
        run: npm run test:bun

      - name: Build
        run: npm run build

      # ADR 0001 says Bun is verified, not merely claimed. The same dist/ has to
      # boot under bun:sqlite and answer requests. The screens are the same
      # three the Node boot smokes.
      - name: Boot under Bun and smoke the screens
        env:
          OVERHEARD_MOCK_PROVIDERS: "1"
          DATABASE_PATH: ./data/ci-bun.db
          PORT: "3901"
        run: |
          bun server/index.mjs > server-bun.log 2>&1 &
          server_pid=$!
          curl --fail --silent --show-error \
               --retry 30 --retry-delay 2 --retry-connrefused \
               --output /dev/null http://127.0.0.1:3901/start
          echo "/start answered 200"
          for path in / /settings; do
            curl --fail --silent --show-error \
                 --output /dev/null "http://127.0.0.1:3901$path"
            echo "$path answered 200"
          done
          grep "driver=bun:sqlite" server-bun.log
          kill "$server_pid" || true

      - name: Server log
        if: always()
        run: cat server-bun.log || true
